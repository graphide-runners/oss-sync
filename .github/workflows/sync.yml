name: sync
# About every 15 minutes, each fork in repos.tsv takes one step along its upstream (sync.sh).
# Each run dispatches the next one 10 minutes after its steps end ("Chain the next run"), because
# GitHub's schedule never fired for this repository after its transfer to graphide-runners: not
# after a commit changing the cron line (b99622b) nor after the workflow was disabled and enabled
# again (15:13Z). The schedule stays as a backup; the chain dispatches nothing while another run is
# queued or running, so the two never make two chains. Stop it with the repository variable
# SYNC_CHAIN=off, or by disabling the workflow.
on:
  schedule:
    - cron: "4-59/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print each step, push nothing"
        type: boolean
        default: false
permissions:
  # write: the chain step dispatches this workflow again (a GITHUB_TOKEN dispatch does start a run).
  actions: write
  contents: read
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Step each fork
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # Replay (Ben, 2026-11-01): the forks were rewound 40 first-parent commits so they
          # step through upstream's history one commit a round instead of waiting at its tip;
          # sync.sh's default (6) would skip a rewound fork straight back to 6 behind.
          MAX_BEHIND: "45"
          # Push governor (Ben, 2026-11-01: the forks spent production's whole $650 daily cap by
          # 12:46Z and every tenant's jobs waited): from GOVERNOR_FROM on, a fork steps at most
          # PUSHES_PER_DAY times a UTC day, and the forks in PUSHES_ONE_A_DAY (about 10,000 and
          # 8,000 job-seconds a push) once. Raise them only when the cap leaves room.
          GOVERNOR_FROM: "2026-11-02"
          PUSHES_PER_DAY: "2"
          PUSHES_ONE_A_DAY: "graphide-oss/tokio graphide-oss/pydantic"
          DEPLOY_KEY_TOKIO: ${{ secrets.DEPLOY_KEY_TOKIO }}
          DEPLOY_KEY_RUST_ANALYZER: ${{ secrets.DEPLOY_KEY_RUST_ANALYZER }}
          DEPLOY_KEY_PYDANTIC: ${{ secrets.DEPLOY_KEY_PYDANTIC }}
          DEPLOY_KEY_PRETTIER: ${{ secrets.DEPLOY_KEY_PRETTIER }}
          DEPLOY_KEY_FASTAPI: ${{ secrets.DEPLOY_KEY_FASTAPI }}
          DEPLOY_KEY_TERRAFORM: ${{ secrets.DEPLOY_KEY_TERRAFORM }}
          DEPLOY_KEY_VITE: ${{ secrets.DEPLOY_KEY_VITE }}
          DEPLOY_KEY_GIN: ${{ secrets.DEPLOY_KEY_GIN }}
          DEPLOY_KEY_NETBOX: ${{ secrets.DEPLOY_KEY_NETBOX }}
          # Private copies (not forks): this workflow's token cannot read their runs, so the
          # loop reads these with GH_TOKEN_PRIVATE (a token with Actions: read on each).
          PRIVATE_FORKS: "graphide-oss/netbox"
          GH_TOKEN_PRIVATE: ${{ secrets.OSS_SYNC_PRIVATE_READ_TOKEN }}
        run: |
          set -uo pipefail
          keys="$RUNNER_TEMP/keys"
          mkdir -m 700 "$keys"
          # GitHub's host keys from its own meta endpoint, so ssh trusts nothing else.
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >"$keys/known_hosts"
          failed=0
          public_token="$GH_TOKEN"
          while IFS=$'\t' read -r up fork branch; do
            case "$up" in ''|'#'*) continue ;; esac
            export GH_TOKEN="$public_token"
            case " $PRIVATE_FORKS " in
              *" $fork "*)
                # Until the read token is stored, the private copy is skipped, not failed: a red
                # run every round would hide the forks' real failures.
                if [ -z "${GH_TOKEN_PRIVATE:-}" ]; then echo "::notice::$fork: no secret OSS_SYNC_PRIVATE_READ_TOKEN yet; not stepping"; continue; fi
                export GH_TOKEN="$GH_TOKEN_PRIVATE" ;;
            esac
            # A fork steps only once its last step's push runs have all ended: graphide-oss runs
            # 4 jobs at a time, and stepping every round left 55 jobs queued (16:40Z), one of them
            # an hour; a newer push would also cancel the runs a sample needs.
            busy=0
            for st in queued in_progress waiting pending requested; do
              n=$(gh api "repos/$fork/actions/runs?branch=$branch&event=push&status=$st&per_page=1" --jq .total_count) || n=1
              busy=$((busy + n))
            done
            if [ "$busy" -gt 0 ]; then echo "$fork: $busy push runs not ended; not stepping this round"; continue; fi
            # The governor counts today's pushes as distinct head commits of today's push runs.
            # GitHub stamped run times an hour ahead around the 2026-11-01 clock change, so a
            # count near midnight can be off by an hour; the governor errs toward not stepping.
            today=$(date -u +%F)
            if [[ ! "$today" < "$GOVERNOR_FROM" ]]; then
              limit="$PUSHES_PER_DAY"
              case " $PUSHES_ONE_A_DAY " in *" $fork "*) limit=1 ;; esac
              pushed=$(gh api "repos/$fork/actions/runs?branch=$branch&event=push&created=>=${today}T00:00:00Z&per_page=100" \
                --jq '[.workflow_runs[].head_sha] | unique | length') || pushed="$limit"
              if [ "$pushed" -ge "$limit" ]; then echo "$fork: $pushed pushes today, the governor allows $limit; not stepping"; continue; fi
            fi
            var="DEPLOY_KEY_$(printf '%s' "${fork#*/}" | tr 'a-z-' 'A-Z_')"
            key="${!var:-}"
            if [ -z "$key" ]; then echo "::error::$fork: no secret $var"; failed=1; continue; fi
            printf '%s\n' "$key" >"$keys/$var"
            chmod 600 "$keys/$var"
            export GIT_SSH_COMMAND="ssh -i $keys/$var -o IdentitiesOnly=yes -o UserKnownHostsFile=$keys/known_hosts -o StrictHostKeyChecking=yes"
            if ! ./sync.sh "$up" "$fork" "$branch" </dev/null; then echo "::error::$fork: sync failed"; failed=1; fi
          done <repos.tsv
          exit "$failed"
      - name: Chain the next run
        if: ${{ always() && !inputs.dry_run && vars.SYNC_CHAIN != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          sleep 600
          # Another run already queued or running (the schedule's, or a hand dispatch) carries on.
          others=$(gh run list -R "$GITHUB_REPOSITORY" -w sync.yml -L 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"in_progress\"))] | length")
          if [ "${others:-0}" != 0 ]; then echo "another run is queued or running; not chaining"; exit 0; fi
          gh workflow run sync.yml -R "$GITHUB_REPOSITORY" -f dry_run=false
